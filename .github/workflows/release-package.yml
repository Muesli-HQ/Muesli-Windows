name: Release package

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the build to a draft GitHub Release"
        type: boolean
        default: true

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\windows-native\Muesli.Windows\Muesli.Windows.csproj

      - name: Install vpk CLI
        run: dotnet tool install -g vpk

      - name: Build, fetch bundled Python, package zip + Velopack Setup.exe
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        shell: pwsh
        run: .\scripts\package-windows-v1.ps1

      - name: Smoke test packaged zip
        shell: pwsh
        run: .\scripts\test-windows-package.ps1 -SkipLaunch

      - name: Read app version from csproj
        id: version
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content .\windows-native\Muesli.Windows\Muesli.Windows.csproj)
          $version = $csproj.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not read <Version> from csproj." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload publish folder (contributor build)
        uses: actions/upload-artifact@v4
        with:
          name: muesli-windows-v1-win-x64
          path: publish/muesli-windows-win-x64/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload Velopack artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: muesli-windows-velopack
          path: |
            artifacts/velopack/Muesli-win-Setup.exe
            artifacts/velopack/*.nupkg
            artifacts/velopack/releases.win.json
          if-no-files-found: error
          retention-days: 30

      - name: Attach to draft GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Muesli v${{ steps.version.outputs.version }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            artifacts/velopack/Muesli-win-Setup.exe
            artifacts/velopack/*.nupkg
            artifacts/velopack/releases.win.json
            artifacts/muesli-windows-v1-win-x64.zip
