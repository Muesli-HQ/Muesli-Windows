name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore windows-native\Muesli.Windows.Tests\Muesli.Windows.Tests.csproj

      - name: Build Release
        run: dotnet build windows-native\Muesli.Windows\Muesli.Windows.csproj -c Release --no-restore

      - name: Run hardware-free regression tests
        run: dotnet test windows-native\Muesli.Windows.Tests\Muesli.Windows.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=windows-tests.trx"

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -LiteralPath scripts -Filter *.ps1 -File
          foreach ($script in $scripts) {
            [scriptblock]::Create((Get-Content -LiteralPath $script.FullName -Raw)) | Out-Null
          }

      - name: Build public win-x64 package
        shell: pwsh
        run: ./scripts/package-windows-v1.ps1 -Configuration Release -Runtime win-x64

      - name: Smoke-test public package
        shell: pwsh
        run: ./scripts/test-windows-package.ps1 -ZipPath ./artifacts/muesli-windows-0.2.0-win-x64.zip

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-report
          path: windows-native/Muesli.Windows.Tests/TestResults/*.trx
